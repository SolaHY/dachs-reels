name: publish

on:
  # 本番のトリガは cron-job.org からの repository_dispatch。
  # GitHub の schedule は数時間遅れることがあるので保険として残す。
  repository_dispatch:
    types: [publish]
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * *'   # 08:20 JST

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # state/ の更新とリリース添付の操作に必要
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXVERSE_API_KEY: ${{ secrets.PIXVERSE_API_KEY }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          PET_NAMES: ${{ vars.PET_NAMES }}
          LIVE_RATIO: ${{ vars.LIVE_RATIO || '1.0' }}
          QUEUE_TARGET: ${{ vars.QUEUE_TARGET || '7' }}
          PROMPT_PROVIDER: ${{ vars.PROMPT_PROVIDER || 'gemini' }}
        run: python -m app.main publish
